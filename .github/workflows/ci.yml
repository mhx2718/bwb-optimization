name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Static compile
        run: python -m compileall -q src tests scripts
      - name: Notebook is the deterministic builder output
        run: |
          python scripts/build_notebook.py
          git diff --exit-code -- notebooks/01_reproducible_bwb_optimization.ipynb
      - name: Test
        env:
          PYTHONHASHSEED: "20260819"
          CUBLAS_WORKSPACE_CONFIG: ":4096:8"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: pytest -q
